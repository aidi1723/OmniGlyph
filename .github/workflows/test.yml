name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e '.[dev]'
      - run: pytest -v
      - run: omniglyph --version
      - run: scripts/mcp_smoke_test.sh omniglyph-mcp

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install build twine
      - run: python -m build --outdir dist
      - run: python - <<'PY'
          import tomllib
          from pathlib import Path
          version = tomllib.loads(Path("pyproject.toml").read_text())["project"]["version"]
          assert (Path("dist") / f"omniglyph-{version}-py3-none-any.whl").exists()
          assert (Path("dist") / f"omniglyph-{version}.tar.gz").exists()
        PY
      - run: python -m twine check dist/omniglyph-*.whl dist/omniglyph-*.tar.gz
      - run: python scripts/artifact_audit.py --wheel dist/omniglyph-$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')-py3-none-any.whl --sdist dist/omniglyph-$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])').tar.gz
